<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>af — User Story Map</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-top">
      <div class="header-text">
        <h1 id="usm-heading">af — User Story Map</h1>
        <p>Activities and steps at the top; under each step, the stories grouped by version. Click a story to see its detail. Click a version chip to collapse it. Ctrl + mouse wheel for horizontal scroll.</p>
        <div class="legend" aria-label="Status legend">
          <span class="legend-item"><span class="legend-swatch proposed"></span>proposed</span>
          <span class="legend-item"><span class="legend-swatch ready"></span>ready to start</span>
          <span class="legend-item"><span class="legend-swatch active"></span>in progress</span>
          <span class="legend-item"><span class="legend-swatch done"></span>done</span>
          <span class="legend-item"><span class="legend-swatch dropped"></span>dropped</span>
        </div>
        <div class="header-chips" aria-label="Indicators">
          <button type="button" class="header-chip bugs-chip" id="bugs-chip" aria-pressed="false" hidden>
            <span aria-hidden="true">🐞</span>
            <span class="chip-count" id="bugs-chip-count">0</span>
            <span class="chip-label">open bugs</span>
          </button>
          <button type="button" class="header-chip tray-chip" id="tray-chip" hidden>
            <span aria-hidden="true">📋</span>
            <span class="chip-count" id="tray-chip-count">0</span>
            <span class="chip-label">unassigned</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div id="usm-root"></div>
  </main>

  <aside id="detail-pane" class="detail-pane" aria-hidden="true" aria-labelledby="pane-title">
    <button type="button" class="close-btn" id="pane-close" aria-label="Close panel">×</button>
    <div id="pane-content"></div>
  </aside>

  <!-- Generic modal -->
  <div id="modal-backdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="specs.js"></script>
  <script src="bugs.js"></script>
  <script>
    (function () {
      const data = window.USM_DATA;
      const specs = window.USM_SPECS || [];
      const bugs = window.USM_BUGS || [];
      const root = document.getElementById('usm-root');

      const STATUS_LABEL = {
        proposed: 'proposed',
        ready: 'ready to start',
        active: 'in progress',
        done: 'done',
        dropped: 'dropped'
      };
      const BUG_STATUS_LABEL = {
        open: 'open',
        'in-progress': 'in progress',
        fixed: 'fixed',
        'wont-fix': 'won\'t fix'
      };
      const SPEC_STATUS_LABEL = {
        draft: 'draft',
        ready: 'ready',
        approved: 'approved',
        archived: 'archived'
      };

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
      }

      function slugify(str) {
        return String(str).toLowerCase()
          .replace(/\s+/g, '-')
          .replace(/[^a-z0-9-]/g, '-')
          .replace(/-+/g, '-')
          .replace(/^-|-$/g, '');
      }

      // ===== Pending changes state =====
      // Persisted to localStorage so it survives a refresh.
      // Saved on every change; on load it reconciles with data.js to
      // drop items that have already been applied.
      const STORAGE_KEY = 'af_usm_pending_v2';
      const pendingChanges = {
        newSlice: null,
        moves: {}
      };

      function savePendingChanges() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(pendingChanges));
        } catch (e) { /* localStorage unavailable: ignore it */ }
      }

      function loadPendingChanges() {
        let raw = null;
        try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return; }
        if (!raw) return;
        let parsed;
        try { parsed = JSON.parse(raw); } catch (e) { return; }
        if (!parsed || typeof parsed !== 'object') return;

        if (parsed.newSlice && parsed.newSlice.id && parsed.newSlice.title) {
          const exists = (data.slices || []).some(function (s) { return s.id === parsed.newSlice.id; });
          if (!exists) pendingChanges.newSlice = parsed.newSlice;
        }
        if (parsed.moves && typeof parsed.moves === 'object') {
          const clean = {};
          Object.keys(parsed.moves).forEach(function (storyId) {
            const target = parsed.moves[storyId];
            const story = findStoryById(storyId);
            if (!story) return;
            if ((story.slice || null) === (target || null)) return;
            clean[storyId] = target;
          });
          pendingChanges.moves = clean;
        }
        savePendingChanges();
      }

      function getEffectiveSlice(story) {
        if (Object.prototype.hasOwnProperty.call(pendingChanges.moves, story.id)) {
          return pendingChanges.moves[story.id];
        }
        return story.slice || null;
      }

      // Slice status. If the slice has an explicit `status`, that wins.
      // Otherwise it is inferred from the assigned US: if any is `active`
      // or `done`, → in-progress; if all are `proposed` (or there are none), →
      // planning. `released` is always manual (shipping is a human decision).
      const SLICE_STATUS_LABEL = {
        planning: 'planning',
        'in-progress': 'in progress',
        released: 'released'
      };
      const VALID_SLICE_STATUS = { planning: true, 'in-progress': true, released: true };

      function getSliceStatus(sliceId) {
        if (sliceId === '__backlog__') return null;
        let slice = null;
        if (pendingChanges.newSlice && pendingChanges.newSlice.id === sliceId) {
          slice = pendingChanges.newSlice;
        } else {
          slice = (data.slices || []).find(function (s) { return s.id === sliceId; });
        }
        if (!slice) return 'planning';
        if (slice.status && VALID_SLICE_STATUS[slice.status]) return slice.status;
        // Infer from the assigned US (taking pending moves into account).
        let hasActiveOrDone = false;
        data.activities.forEach(function (act) {
          (act.steps || []).forEach(function (step) {
            (step.stories || []).forEach(function (story) {
              if (getEffectiveSlice(story) !== sliceId) return;
              if (story.status === 'active' || story.status === 'done') hasActiveOrDone = true;
            });
          });
        });
        return hasActiveOrDone ? 'in-progress' : 'planning';
      }

      function isReleasedBand(bandId) {
        return getSliceStatus(bandId) === 'released';
      }

      function getEffectiveBands() {
        const allSlices = (data.slices || []).slice();
        if (pendingChanges.newSlice) allSlices.push(pendingChanges.newSlice);
        const decorated = allSlices.map(function (s) {
          const st = getSliceStatus(s.id);
          return { id: s.id, title: s.title, status: st, released: st === 'released', isBacklog: false };
        });
        const upcoming = decorated.filter(function (b) { return !b.released; });
        const releasedReversed = decorated.filter(function (b) { return b.released; }).reverse();
        const bands = upcoming.concat(releasedReversed);
        bands.push({ id: '__backlog__', title: 'Backlog', status: null, released: false, isBacklog: true });
        return bands;
      }

      function countStoriesInBand(band) {
        let n = 0;
        data.activities.forEach(function (act) {
          (act.steps || []).forEach(function (step) {
            (step.stories || []).forEach(function (story) {
              const eff = getEffectiveSlice(story);
              if (band.isBacklog ? !eff : eff === band.id) n += 1;
            });
          });
        });
        return n;
      }

      // ===== Grid =====
      const grid = document.createElement('div');
      grid.className = 'usm-grid';
      root.appendChild(grid);

      // Open bugs (open|in-progress) by story id. Recomputed on every
      // renderMap in case the bugs JS changes at runtime.
      function openBugsByStory() {
        const m = {};
        bugs.forEach(function (b) {
          if (!b.story) return;
          if (b.status !== 'open' && b.status !== 'in-progress') return;
          m[b.story] = (m[b.story] || 0) + 1;
        });
        return m;
      }

      function totalOpenBugs() {
        return bugs.filter(function (b) {
          return b.status === 'open' || b.status === 'in-progress';
        }).length;
      }

      function trayItems() {
        const drafts = specs.filter(function (s) { return s.status === 'draft'; });
        const orphanBugs = bugs.filter(function (b) { return !b.story; });
        return { drafts: drafts, orphanBugs: orphanBugs };
      }

      function updateHeaderChips() {
        const openBugs = totalOpenBugs();
        const bugsChip = document.getElementById('bugs-chip');
        const bugsCount = document.getElementById('bugs-chip-count');
        if (openBugs > 0) {
          bugsCount.textContent = String(openBugs);
          bugsChip.hidden = false;
        } else {
          bugsChip.hidden = true;
          // If the filter was active and there are no more bugs, turn it off.
          if (grid.classList.contains('filter-bugs-only')) {
            grid.classList.remove('filter-bugs-only');
            bugsChip.setAttribute('aria-pressed', 'false');
          }
        }
        const tray = trayItems();
        const trayTotal = tray.drafts.length + tray.orphanBugs.length;
        const trayChip = document.getElementById('tray-chip');
        const trayCount = document.getElementById('tray-chip-count');
        if (trayTotal > 0) {
          trayCount.textContent = String(trayTotal);
          trayChip.hidden = false;
        } else {
          trayChip.hidden = true;
        }
      }

      function renderMap() {
        while (grid.firstChild) grid.removeChild(grid.firstChild);

        const bugsByStory = openBugsByStory();

        const activityRanges = [];
        let totalCols = 0;
        data.activities.forEach(function (act) {
          const span = Math.max(1, act.steps.length);
          activityRanges.push({ start: totalCols + 1, span: span });
          totalCols += span;
        });

        grid.style.gridTemplateColumns = 'repeat(' + totalCols + ', 120px)';

        // Row 1: activities
        data.activities.forEach(function (act, i) {
          const r = activityRanges[i];
          const el = document.createElement('div');
          el.className = 'cell activity';
          el.style.gridRow = '1';
          el.style.gridColumn = r.start + ' / span ' + r.span;
          el.textContent = act.title;
          grid.appendChild(el);
        });

        // Row 2: steps
        let col = 1;
        data.activities.forEach(function (act) {
          if (act.steps.length === 0) {
            const el = document.createElement('div');
            el.className = 'cell step empty';
            el.style.gridRow = '2';
            el.style.gridColumn = String(col);
            el.textContent = 'no steps yet';
            grid.appendChild(el);
            col += 1;
          } else {
            act.steps.forEach(function (step) {
              const el = document.createElement('div');
              el.className = 'cell step';
              el.dataset.stepId = step.id;
              el.style.gridRow = '2';
              el.style.gridColumn = String(col);
              el.textContent = step.title;
              grid.appendChild(el);
              col += 1;
            });
          }
        });

        // Column overlays (one per real step, spans the full height)
        let overlayCol = 1;
        data.activities.forEach(function (act) {
          if (act.steps.length === 0) {
            overlayCol += 1;
            return;
          }
          act.steps.forEach(function (step) {
            const ov = document.createElement('div');
            ov.className = 'col-overlay';
            ov.dataset.stepId = step.id;
            ov.style.gridColumn = String(overlayCol);
            ov.style.gridRow = '1 / -1';
            grid.appendChild(ov);
            overlayCol += 1;
          });
        });

        // Bands
        const bands = getEffectiveBands();
        let nextRow = 3;

        // "+ New release" placeholder when there isn't a pending one.
        if (!pendingChanges.newSlice) {
          const ph = document.createElement('div');
          ph.className = 'slice-divider slice-divider-placeholder';
          ph.style.gridRow = String(nextRow);
          const phWrap = document.createElement('div');
          phWrap.className = 'slice-divider-actions';
          const phBtn = document.createElement('button');
          phBtn.type = 'button';
          phBtn.className = 'slice-divider-label';
          phBtn.textContent = '+ New release';
          phBtn.addEventListener('click', openNewReleaseModal);
          phWrap.appendChild(phBtn);
          ph.appendChild(phWrap);
          grid.appendChild(ph);
          nextRow += 1;
        }

        bands.forEach(function (band) {
          // Divider + chip + inline actions (only on the pending release)
          const divider = document.createElement('div');
          let dividerCls = 'slice-divider';
          if (band.released) dividerCls += ' released';
          if (band.status) dividerCls += ' status-' + band.status;
          if (band.isBacklog) dividerCls += ' backlog';
          divider.className = dividerCls;
          divider.dataset.bandId = band.id;
          divider.dataset.collapsed = 'false';
          divider.style.gridRow = String(nextRow);

          const wrap = document.createElement('div');
          wrap.className = 'slice-divider-actions';

          const label = document.createElement('button');
          label.type = 'button';
          label.className = 'slice-divider-label';
          label.setAttribute('aria-expanded', 'true');

          const labelText = document.createElement('span');
          if (band.isBacklog) {
            labelText.textContent = 'Backlog';
          } else {
            const statusSuffix = band.status ? ' · ' + (SLICE_STATUS_LABEL[band.status] || band.status) : '';
            labelText.textContent = 'Version ' + band.title + statusSuffix;
          }
          label.appendChild(labelText);

          const cnt = document.createElement('span');
          cnt.className = 'slice-count';
          cnt.textContent = String(countStoriesInBand(band));
          label.appendChild(cnt);

          (function (bandId) {
            function toggleBand() {
              const isCollapsed = divider.dataset.collapsed === 'true';
              const nxt = !isCollapsed;
              divider.dataset.collapsed = String(nxt);
              label.setAttribute('aria-expanded', String(!nxt));
              grid.querySelectorAll('.story-cell[data-band-id="' + bandId + '"]').forEach(function (cell) {
                cell.style.display = nxt ? 'none' : '';
              });
            }
            label.addEventListener('click', function (e) {
              e.stopPropagation();
              toggleBand();
            });
          })(band.id);

          wrap.appendChild(label);

          // Inline actions for the pending release
          const isPendingBand = pendingChanges.newSlice && pendingChanges.newSlice.id === band.id;
          if (isPendingBand) {
            const generateBtn = document.createElement('button');
            generateBtn.type = 'button';
            generateBtn.className = 'slice-action primary';
            generateBtn.textContent = 'Generate instruction';
            generateBtn.addEventListener('click', openInstructionModal);
            wrap.appendChild(generateBtn);

            const cancelBtn = document.createElement('button');
            cancelBtn.type = 'button';
            cancelBtn.className = 'slice-action danger';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.addEventListener('click', openCancelConfirmModal);
            wrap.appendChild(cancelBtn);
          }

          divider.appendChild(wrap);
          grid.appendChild(divider);
          nextRow += 1;

          // Stories row
          const storiesRow = nextRow;
          let c = 1;
          data.activities.forEach(function (act) {
            if (act.steps.length === 0) {
              c += 1;
              return;
            }
            act.steps.forEach(function (step) {
              const matching = step.stories.filter(function (s) {
                const eff = getEffectiveSlice(s);
                return band.isBacklog ? !eff : eff === band.id;
              });

              const cell = document.createElement('div');
              cell.className = 'story-cell';
              cell.dataset.bandId = band.id;
              cell.dataset.bandReleased = band.released ? 'true' : 'false';
              cell.dataset.stepId = step.id;
              cell.style.gridRow = String(storiesRow);
              cell.style.gridColumn = String(c);

              if (!band.released) {
                cell.addEventListener('dragover', handleDragOver);
                cell.addEventListener('dragleave', handleDragLeave);
                cell.addEventListener('drop', handleDrop);
              }

              matching.forEach(function (story) {
                const isLinkable = !!story.id;
                const tag = isLinkable ? 'a' : 'div';
                const el = document.createElement(tag);
                const bugCount = bugsByStory[story.id] || 0;
                let storyCls = 'story status-' + (story.status || 'proposed');
                if (band.released) storyCls += ' released';
                else storyCls += ' draggable';
                if (Object.prototype.hasOwnProperty.call(pendingChanges.moves, story.id)) {
                  storyCls += ' moved';
                }
                if (bugCount > 0) storyCls += ' has-open-bugs';
                el.className = storyCls;

                if (!band.released) {
                  el.draggable = true;
                  el.addEventListener('dragstart', function (e) {
                    e.dataTransfer.setData('text/plain', story.id);
                    e.dataTransfer.effectAllowed = 'move';
                    el.classList.add('dragging');
                    document.body.classList.add('dragging-story');
                  });
                  el.addEventListener('dragend', function () {
                    el.classList.remove('dragging');
                    document.body.classList.remove('dragging-story');
                  });
                }

                if (isLinkable) {
                  el.href = '#' + encodeURIComponent(story.id);
                  el.addEventListener('click', function (e) {
                    e.preventDefault();
                    openStoryPane(story, step, act);
                  });
                }
                if (story.id) {
                  el.dataset.storyId = story.id;
                  const idEl = document.createElement('span');
                  idEl.className = 'us-id';
                  idEl.textContent = story.id;
                  el.appendChild(idEl);
                }
                const titleEl = document.createElement('span');
                titleEl.className = 'us-title';
                titleEl.textContent = story.title;
                el.appendChild(titleEl);
                if (bugCount > 0) {
                  const bugBadge = document.createElement('span');
                  bugBadge.className = 'us-bugs';
                  bugBadge.title = bugCount + ' open bug' + (bugCount === 1 ? '' : 's');
                  bugBadge.textContent = '🐞 ' + bugCount;
                  el.appendChild(bugBadge);
                }
                cell.appendChild(el);
              });

              grid.appendChild(cell);
              c += 1;
            });
          });
          nextRow += 1;
        });

        updateHeaderChips();

        // Double tick to make sure the layout is ready before measuring.
        requestAnimationFrame(function () {
          updateRowHeights();
          requestAnimationFrame(updateRowHeights);
        });
        currentStepId = null;

        // If the pane is open, re-mark the selected story
        // (the re-render clears the .selected class).
        if (pane && pane.classList.contains('open')) {
          const currentId = decodeURIComponent(location.hash.replace(/^#/, ''));
          if (currentId) markStorySelected(currentId);
        }
      }

      function updateRowHeights() {
        const firstActivity = grid.querySelector('.cell.activity');
        if (!firstActivity) return;
        const h = firstActivity.offsetHeight;
        if (h <= 0) return;
        grid.style.setProperty('--row1-height', h + 'px');
        // Also apply it directly to each step, without relying on the variable.
        grid.querySelectorAll('.cell.step').forEach(function (el) {
          el.style.top = h + 'px';
        });
      }
      window.addEventListener('resize', updateRowHeights);

      // ===== Column hover =====
      let currentStepId = null;
      function clearColumnHover() {
        if (!currentStepId) return;
        grid.querySelectorAll('[data-step-id="' + currentStepId + '"]').forEach(function (el) {
          el.classList.remove('col-hover');
        });
        currentStepId = null;
      }
      grid.addEventListener('mousemove', function (e) {
        const target = e.target.closest('[data-step-id]');
        const stepId = target ? target.dataset.stepId : null;
        if (stepId === currentStepId) return;
        clearColumnHover();
        if (stepId) {
          grid.querySelectorAll('[data-step-id="' + stepId + '"]').forEach(function (el) {
            el.classList.add('col-hover');
          });
          currentStepId = stepId;
        }
      });
      grid.addEventListener('mouseleave', clearColumnHover);

      // ===== Drag & drop =====
      function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        e.currentTarget.classList.add('drop-target-active');
      }
      function handleDragLeave(e) {
        e.currentTarget.classList.remove('drop-target-active');
      }
      function handleDrop(e) {
        e.preventDefault();
        e.currentTarget.classList.remove('drop-target-active');
        document.body.classList.remove('dragging-story');
        const storyId = e.dataTransfer.getData('text/plain');
        if (!storyId) return;
        const bandId = e.currentTarget.dataset.bandId;
        const targetSlice = bandId === '__backlog__' ? null : bandId;

        // Make sure the change is not redundant (drop on the origin band)
        const story = findStoryById(storyId);
        if (story && getEffectiveSlice(story) === targetSlice) return;

        pendingChanges.moves[storyId] = targetSlice;
        savePendingChanges();
        renderMap();
      }

      function findStoryById(id) {
        for (const act of data.activities) {
          for (const step of act.steps || []) {
            for (const story of step.stories || []) {
              if (story.id === id) return story;
            }
          }
        }
        return null;
      }

      // ===== Side pane =====
      const pane = document.getElementById('detail-pane');
      const paneContent = document.getElementById('pane-content');
      const paneClose = document.getElementById('pane-close');

      function findSlice(sliceId) {
        if (pendingChanges.newSlice && pendingChanges.newSlice.id === sliceId) return pendingChanges.newSlice;
        return (data.slices || []).find(function (s) { return s.id === sliceId; });
      }

      function clearSelectedStory() {
        grid.querySelectorAll('.story.selected').forEach(function (el) {
          el.classList.remove('selected');
        });
      }

      function markStorySelected(storyId) {
        clearSelectedStory();
        if (!storyId) return null;
        const el = grid.querySelector('.story[data-story-id="' + storyId + '"]');
        if (el) el.classList.add('selected');
        return el;
      }

      function scrollToCenterStory(storyEl) {
        if (!storyEl) return;
        const main = document.querySelector('main');
        const rect = storyEl.getBoundingClientRect();
        const viewport = window.innerWidth;
        // Logical width of the pane when open (matches the CSS).
        const paneWidth = Math.max(360, viewport * 0.5);
        const visibleWidth = viewport - paneWidth;
        const visibleCenter = visibleWidth / 2;
        const storyCenter = (rect.left + rect.right) / 2;
        const delta = storyCenter - visibleCenter;
        if (Math.abs(delta) > 20) {
          main.scrollBy({ left: delta, behavior: 'smooth' });
        }
      }

      // ===== Render SPEC and BUG in the pane =====
      // Each item is shown as a collapsible card with all the template
      // sections. Open by default if the item is active (ready/approved
      // for SPEC; open/in-progress for BUG) and closed if it is already
      // finished (archived/fixed/wont-fix), to keep the pane manageable
      // when they pile up.

      function renderSubtaskList(items) {
        if (!Array.isArray(items) || items.length === 0) return '';
        let html = '<ul class="pane-subtasks">';
        items.forEach(function (t) {
          const done = !!t.done;
          html += '<li class="' + (done ? 'done' : 'pending') + '">' +
                    '<span class="subtask-check" aria-hidden="true">' + (done ? '✓' : '☐') + '</span>' +
                    '<span class="subtask-desc">' + escapeHtml(t.description || '') + '</span>' +
                  '</li>';
        });
        html += '</ul>';
        return html;
      }

      function renderTextSection(label, value) {
        if (!value || !String(value).trim()) return '';
        return '<div class="card-section"><h4>' + escapeHtml(label) + '</h4><p>' +
               escapeHtml(value) + '</p></div>';
      }

      function renderListSection(label, items) {
        if (!Array.isArray(items) || items.length === 0) return '';
        let html = '<div class="card-section"><h4>' + escapeHtml(label) + '</h4><ol>';
        items.forEach(function (s) { html += '<li>' + escapeHtml(s) + '</li>'; });
        html += '</ol></div>';
        return html;
      }

      function hasInlineSpec(story) {
        return Boolean(
          (story.context && story.context.trim()) ||
          (story.problem && story.problem.trim()) ||
          (Array.isArray(story.constraints) && story.constraints.length > 0) ||
          (Array.isArray(story.subtasks) && story.subtasks.length > 0) ||
          (Array.isArray(story.edgeCases) && story.edgeCases.length > 0) ||
          (Array.isArray(story.doneCriteria) && story.doneCriteria.length > 0)
        );
      }

      function renderInlineSpec(story) {
        // Lifecycle on the US: proposed | ready | active | done | dropped.
        // The pane shows the US status as the readiness signal — no separate
        // spec id/title/status row.
        let html = '<div class="pane-card spec-card spec-inline">';
        html += renderTextSection('Context', story.context);
        html += renderTextSection('Problem', story.problem);
        html += renderTextSection('Constraints', story.constraints);
        if (Array.isArray(story.subtasks) && story.subtasks.length > 0) {
          html += '<div class="card-section"><h4>Subtasks</h4>' +
                  renderSubtaskList(story.subtasks) + '</div>';
        }
        html += renderTextSection('Edge cases', story.edgeCases);
        html += renderTextSection('Done criteria', story.doneCriteria);
        html += '</div>';
        return html;
      }

      function renderSpec(spec) {
        const st = spec.status || 'draft';
        const stLabel = SPEC_STATUS_LABEL[st] || st;
        const openByDefault = (st === 'ready' || st === 'approved');
        let html = '<details class="pane-card spec-card status-' + st + '"' +
                   (openByDefault ? ' open' : '') + '>';
        html +=   '<summary>';
        html +=     '<span class="card-id">' + escapeHtml(spec.id || '(no ID)') + '</span>';
        html +=     '<span class="card-title">' + escapeHtml(spec.title || '') + '</span>';
        html +=     '<span class="card-status spec-' + st + '">' + escapeHtml(stLabel) + '</span>';
        html +=   '</summary>';
        html += renderTextSection('Context', spec.context);
        html += renderTextSection('Problem', spec.problem);
        html += renderTextSection('Constraints', spec.constraints);
        if (Array.isArray(spec.subtasks) && spec.subtasks.length > 0) {
          html += '<div class="card-section"><h4>Subtasks</h4>' +
                  renderSubtaskList(spec.subtasks) + '</div>';
        }
        html += renderTextSection('Edge cases', spec.edgeCases);
        html += renderTextSection('Done criteria', spec.doneCriteria);
        html += '</details>';
        return html;
      }

      function renderBug(bug) {
        const st = bug.status || 'open';
        const stLabel = BUG_STATUS_LABEL[st] || st;
        const openByDefault = (st === 'open' || st === 'in-progress');
        let html = '<details class="pane-card bug-card status-' + st + '"' +
                   (openByDefault ? ' open' : '') + '>';
        html +=   '<summary>';
        html +=     '<span class="card-id">' + escapeHtml(bug.id || '(no ID)') + '</span>';
        html +=     '<span class="card-title">' + escapeHtml(bug.title || '') + '</span>';
        html +=     '<span class="card-status bug-' + st + '">' + escapeHtml(stLabel) + '</span>';
        html +=   '</summary>';
        if (bug.foundAt) {
          html += '<div class="card-meta">' + escapeHtml('Found: ' + bug.foundAt) + '</div>';
        }
        html += renderTextSection('Description', bug.description);
        html += renderListSection('Steps to reproduce', bug.stepsToReproduce);
        html += renderTextSection('Expected result', bug.expected);
        html += renderTextSection('Actual result', bug.actual);
        html += renderTextSection('Affected area', bug.affectedArea);
        html += renderTextSection('Root cause', bug.rootCause);
        if (Array.isArray(bug.fix) && bug.fix.length > 0) {
          html += '<div class="card-section"><h4>Fix</h4>' +
                  renderSubtaskList(bug.fix) + '</div>';
        }
        html += renderTextSection('Regression test', bug.regressionTest);
        html += renderTextSection('Done criteria', bug.doneCriteria);
        html += '</details>';
        return html;
      }

      function openStoryPane(story, step, activity) {
        const statusKey = story.status || 'proposed';
        const statusLabel = STATUS_LABEL[statusKey] || statusKey;
        const effSlice = getEffectiveSlice(story);

        let html = '';
        html +=
          '<div class="pane-breadcrumb">' +
            escapeHtml(activity.title) + ' › ' + escapeHtml(step.title) +
          '</div>';
        if (story.id) html += '<div class="pane-us-id">' + escapeHtml(story.id) + '</div>';

        html +=
          '<h2 class="pane-title" id="pane-title">' +
            escapeHtml(story.title) +
            '<span class="status-badge ' + statusKey + '">' + escapeHtml(statusLabel) + '</span>' +
          '</h2>';

        if (effSlice) {
          const sl = findSlice(effSlice);
          if (sl) {
            const sliceStatus = getSliceStatus(sl.id);
            const cls = 'pane-version status-' + (sliceStatus || 'planning') +
                        (sliceStatus === 'released' ? ' released' : '');
            const suffix = sliceStatus ? ' · ' + (SLICE_STATUS_LABEL[sliceStatus] || sliceStatus) : '';
            html += '<div class="' + cls + '">' + escapeHtml(sl.title) + escapeHtml(suffix) + '</div>';
          }
        } else {
          html += '<div class="pane-version backlog">Backlog</div>';
        }

        if (story.rationale && story.rationale.trim()) {
          html += '<div class="pane-section"><h3>Why it matters</h3><p>' + escapeHtml(story.rationale) + '</p></div>';
        }

        html += '<div class="pane-section"><h3>Narrative</h3>';
        if (story.description && story.description.trim()) {
          html += '<p>' + escapeHtml(story.description) + '</p>';
        } else {
          html += '<p class="placeholder">Not captured yet.</p>';
        }
        html += '</div>';

        if (Array.isArray(story.acceptance) && story.acceptance.length > 0) {
          html += '<div class="pane-section"><h3>Acceptance criteria</h3><ul>';
          story.acceptance.forEach(function (c) {
            html += '<li>' + escapeHtml(c) + '</li>';
          });
          html += '</ul></div>';
        }

        if (Array.isArray(story.tasks) && story.tasks.length > 0) {
          html += '<div class="pane-section"><h3>Tasks</h3><ul class="pane-tasks">';
          story.tasks.forEach(function (t) {
            const ts = t.status || 'done';
            const tsLabel = STATUS_LABEL[ts] || ts;
            html += '<li>';
            html +=   '<span class="task-status ' + ts + '">' + escapeHtml(tsLabel) + '</span>';
            html +=   '<span>' + escapeHtml(t.title) + '</span>';
            html += '</li>';
          });
          html += '</ul></div>';
        }

        if (hasInlineSpec(story)) {
          html += '<div class="pane-section"><h3>SPEC</h3>';
          html += renderInlineSpec(story);
          html += '</div>';
        }

        const relatedSpecs = specs.filter(function (s) { return s.story === story.id; });
        if (relatedSpecs.length > 0) {
          const heading = hasInlineSpec(story) ? 'Additional SPECs' : 'Related SPECs';
          html += '<div class="pane-section"><h3>' + heading + '</h3>';
          relatedSpecs.forEach(function (s) { html += renderSpec(s); });
          html += '</div>';
        }

        const relatedBugs = bugs.filter(function (b) { return b.story === story.id; });
        if (relatedBugs.length > 0) {
          html += '<div class="pane-section"><h3>Related bugs</h3>';
          relatedBugs.forEach(function (b) { html += renderBug(b); });
          html += '</div>';
        }

        paneContent.innerHTML = html;
        pane.classList.add('open');
        pane.setAttribute('aria-hidden', 'false');
        if (story.id) {
          history.replaceState(null, '', '#' + encodeURIComponent(story.id));
        }
        const selectedEl = markStorySelected(story.id);
        scrollToCenterStory(selectedEl);
        paneClose.focus();
      }

      function closePane() {
        pane.classList.remove('open');
        pane.setAttribute('aria-hidden', 'true');
        clearSelectedStory();
        if (location.hash) {
          history.replaceState(null, '', location.pathname + location.search);
        }
      }

      paneClose.addEventListener('click', closePane);
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        if (document.getElementById('modal-backdrop').getAttribute('aria-hidden') === 'false') {
          closeModal();
        } else if (pane.classList.contains('open')) {
          closePane();
        }
      });

      // Clicking outside the pane closes it (except on a story, which
      // refreshes the content; or on the pane itself).
      document.addEventListener('click', function (e) {
        if (!pane.classList.contains('open')) return;
        if (e.target.closest('#detail-pane')) return;
        if (e.target.closest('.story')) return;
        if (e.target.closest('#modal-backdrop')) return;
        closePane();
      });

      // ===== Generic modal =====
      function openModal(html) {
        document.getElementById('modal-content').innerHTML = html;
        document.getElementById('modal-backdrop').setAttribute('aria-hidden', 'false');
      }
      function closeModal() {
        document.getElementById('modal-backdrop').setAttribute('aria-hidden', 'true');
        document.getElementById('modal-content').innerHTML = '';
      }
      document.getElementById('modal-backdrop').addEventListener('click', function (e) {
        if (e.target === e.currentTarget) closeModal();
      });

      // ===== Modals: New release / Instruction / Cancel =====
      function openNewReleaseModal() {
        openModal(
          '<h2>New release</h2>' +
          '<p>Give the version you are about to build a name. It shows up as a new band above the released versions, and you can start dragging stories from the Backlog into it.</p>' +
          '<div>' +
            '<label for="release-title">Release name</label>' +
            '<input type="text" id="release-title" placeholder="e.g. v1.0" autocomplete="off">' +
          '</div>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn-secondary" id="modal-cancel">Cancel</button>' +
            '<button type="button" class="btn-primary" id="modal-create">Create</button>' +
          '</div>'
        );
        const input = document.getElementById('release-title');
        input.focus();
        function submit() {
          const title = input.value.trim();
          if (!title) return;
          const id = slugify(title) || ('release-' + Date.now());
          pendingChanges.newSlice = { id: id, title: title, status: 'planning' };
          savePendingChanges();
          closeModal();
          renderMap();
        }
        document.getElementById('modal-cancel').addEventListener('click', closeModal);
        document.getElementById('modal-create').addEventListener('click', submit);
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            submit();
          }
        });
      }

      function openInstructionModal() {
        const instruction = {};
        if (pendingChanges.newSlice) instruction.newSlice = pendingChanges.newSlice;
        const moves = Object.keys(pendingChanges.moves).map(function (sid) {
          return { story: sid, toSlice: pendingChanges.moves[sid] };
        });
        if (moves.length > 0) instruction.moves = moves;

        const text =
          'Apply to the USM:\n\n' +
          '```json\n' +
          JSON.stringify(instruction, null, 2) + '\n' +
          '```';

        openModal(
          '<h2>Instruction for Lead</h2>' +
          '<p>Copy this block and paste it into the chat so Claude applies it to <code>data.js</code>.</p>' +
          '<textarea id="instruction-text" readonly></textarea>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn-secondary" id="modal-close-btn">Close</button>' +
            '<button type="button" class="btn-primary" id="modal-copy-btn">Copy to clipboard</button>' +
          '</div>'
        );
        const ta = document.getElementById('instruction-text');
        ta.value = text;
        ta.select();
        document.getElementById('modal-close-btn').addEventListener('click', closeModal);
        document.getElementById('modal-copy-btn').addEventListener('click', function () {
          ta.select();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(ta.value).then(function () {
              const btn = document.getElementById('modal-copy-btn');
              btn.textContent = '✓ Copied';
              setTimeout(function () { btn.textContent = 'Copy to clipboard'; }, 1500);
            });
          } else {
            document.execCommand('copy');
          }
        });
      }

      function openCancelConfirmModal() {
        const moveCount = Object.keys(pendingChanges.moves).length;
        const hasNew = !!pendingChanges.newSlice;
        const pieces = [];
        if (hasNew) pieces.push('the new release');
        if (moveCount > 0) pieces.push(moveCount + ' moved stor' + (moveCount === 1 ? 'y' : 'ies'));
        const lostStr = pieces.length > 0 ? pieces.join(' and ') : 'the pending changes';

        openModal(
          '<h2>Discard pending changes</h2>' +
          '<p>You are about to lose ' + lostStr + '. This action cannot be undone. Continue?</p>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn-secondary" id="cancel-no">No, keep them</button>' +
            '<button type="button" class="btn-primary" id="cancel-yes">Yes, discard</button>' +
          '</div>'
        );
        document.getElementById('cancel-no').addEventListener('click', closeModal);
        document.getElementById('cancel-yes').addEventListener('click', function () {
          pendingChanges.newSlice = null;
          pendingChanges.moves = {};
          try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
          closeModal();
          renderMap();
        });
      }

      // ===== Direct hash to a story on load =====
      function openFromHashIfMatch() {
        const id = decodeURIComponent(location.hash.replace(/^#/, ''));
        if (!id) return;
        for (const act of data.activities) {
          for (const step of act.steps || []) {
            for (const story of step.stories || []) {
              if (story.id === id) {
                openStoryPane(story, step, act);
                return;
              }
            }
          }
        }
      }

      // ===== Drag-to-scroll horizontal =====
      (function initDragScroll() {
        const container = document.querySelector('main');
        const DRAG_THRESHOLD = 5;
        let isDown = false;
        let hasDragged = false;
        let startX = 0;
        let startScrollLeft = 0;

        container.addEventListener('mousedown', function (e) {
          if (e.target.closest('a, button, [role="button"], #detail-pane, .story.draggable')) return;
          isDown = true;
          hasDragged = false;
          startX = e.pageX;
          startScrollLeft = container.scrollLeft;
        });
        window.addEventListener('mousemove', function (e) {
          if (!isDown) return;
          const dx = e.pageX - startX;
          if (!hasDragged && Math.abs(dx) > DRAG_THRESHOLD) {
            hasDragged = true;
            container.classList.add('dragging');
          }
          if (hasDragged) container.scrollLeft = startScrollLeft - dx;
        });
        window.addEventListener('mouseup', function () {
          if (isDown) {
            isDown = false;
            container.classList.remove('dragging');
          }
        });
        container.addEventListener('click', function (e) {
          if (hasDragged) {
            e.preventDefault();
            e.stopPropagation();
            hasDragged = false;
          }
        }, true);

        // Ctrl + mouse wheel = horizontal scroll
        container.addEventListener('wheel', function (e) {
          if (e.ctrlKey) {
            e.preventDefault();
            container.scrollLeft += e.deltaY;
          }
        }, { passive: false });
      })();

      // ===== Header chips: bugs filter and tray =====
      document.getElementById('bugs-chip').addEventListener('click', function () {
        const active = grid.classList.toggle('filter-bugs-only');
        this.setAttribute('aria-pressed', String(active));
      });
      document.getElementById('tray-chip').addEventListener('click', openTrayPane);

      function openTrayPane() {
        const tray = trayItems();
        let html = '';
        html += '<div class="pane-breadcrumb">Tray</div>';
        html += '<h2 class="pane-title" id="pane-title">Unassigned</h2>';

        if (tray.drafts.length > 0) {
          html += '<div class="pane-section"><h3>SPEC drafts</h3>';
          tray.drafts.forEach(function (s) { html += renderSpec(s); });
          html += '</div>';
        }
        if (tray.orphanBugs.length > 0) {
          html += '<div class="pane-section"><h3>Bugs without a story</h3>';
          tray.orphanBugs.forEach(function (b) { html += renderBug(b); });
          html += '</div>';
        }
        if (tray.drafts.length === 0 && tray.orphanBugs.length === 0) {
          html += '<p class="placeholder">Nothing in the tray.</p>';
        }

        paneContent.innerHTML = html;
        pane.classList.add('open');
        pane.setAttribute('aria-hidden', 'false');
        clearSelectedStory();
        history.replaceState(null, '', '#tray');
        paneClose.focus();
      }

      // ===== Project name → document title + heading =====
      // The title is per-project: `data.project` comes from
      // source/skeleton.json (set on init to the repo name). Falls back to
      // "af" when unset so the bare template still reads sensibly.
      function applyProjectName() {
        const name = (typeof data.project === 'string' && data.project.trim())
          ? data.project.trim()
          : 'af';
        const title = name + ' — User Story Map';
        document.title = title;
        const heading = document.getElementById('usm-heading');
        if (heading) heading.textContent = title;
      }

      // ===== Initial render =====
      loadPendingChanges();
      applyProjectName();
      renderMap();
      if (location.hash === '#tray') openTrayPane();
      else openFromHashIfMatch();
    })();
  </script>
